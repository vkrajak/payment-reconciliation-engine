server:
  port: 8092

spring:
  application:
    name: psp-simulator
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

sim:
  psp:
    topic: psp-events
    scenario-topic: sim-scenarios
    consumer-group-id: psp-simulator
    fee-rate: 0.015   # 1.5%, informational only per PspEvent.avsc doc
