server:
  port: 8095

spring:
  application:
    name: exception-classifier
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081
  datasource:
    url: jdbc:postgresql://localhost:5432/recon
    username: recon
    password: recon
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

recon:
  classifier:
    exception-events-topic: exception-events
    consumer-group-id: exception-classifier
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms